---
# Ansible Inventory for Bank Simulator Application
# This inventory targets Docker containers managed by Terraform

all:
  children:
    docker_containers:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
      vars:
        # Docker connection settings
        docker_host: "unix:///Users/liampatty/.colima/default/docker.sock"
        
    healthcare_app:
      hosts:
        localhost:
      vars:
        # Application configuration
        app_name: "healthcare-simulator"
        backend_container: "healthcare-backend"
        frontend_container: "healthcare-frontend"
        database_container: "healthcare-database"
        
        # Network settings
        backend_port: 5001
        frontend_port: 80
        database_port: 5437
        
        # Health check endpoints
        backend_health_url: "http://localhost:5001/health"
        frontend_url: "http://localhost:80"

